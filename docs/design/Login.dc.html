<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#14120D 0%,#2C2718 100%);background-attachment:fixed;color:#F6F1E7;font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
    a{color:#A99BFF;text-decoration:none}
    a:hover{color:#C0B6FF}
    .num{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums}
    .ser{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-0.022em}
    .klabel{font-size:11.5px;letter-spacing:0.10em;text-transform:uppercase;color:#A79C89;font-weight:600;margin-bottom:10px}
    .inp{height:48px;border-radius:10px;border:1px solid rgba(255,238,208,0.26);background:#131009;color:#F6F1E7;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:15.5px}
    .inp .ph{color:#A79C89}
  </style>
</helmet>

<div style="position:relative;min-height:900px;background:linear-gradient(180deg,#14120D 0%,#2C2718 100%);overflow:hidden;display:flex;align-items:center;justify-content:center">

  <svg width="1240" height="1240" viewBox="0 0 100 100" fill="none" style="position:absolute;left:-260px;top:-210px;opacity:0.075;pointer-events:none">
    <path d="M88 50a38 38 0 1 1-13.2-28.8" stroke="#A99BFF" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M89.4 12v18h-18" stroke="#A99BFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg width="880" height="880" viewBox="0 0 100 100" fill="none" style="position:absolute;right:-250px;bottom:-290px;opacity:0.07;pointer-events:none">
    <circle cx="50" cy="50" r="40" stroke="#6A5AE0" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="29" stroke="#6A5AE0" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="18" stroke="#6A5AE0" stroke-width="0.9"/>
  </svg>

  <div style="position:relative;width:436px">

    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:34px">
      <svg width="52" height="52" viewBox="0 0 16 16" fill="none" stroke="#A99BFF" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.6 8a5.6 5.6 0 1 1-1.95-4.25"/>
        <path d="M13.8 2.3v3.3h-3.3"/>
      </svg>
      <div class="ser" style="font-size:44px;letter-spacing:0.26em;margin-top:18px;padding-left:0.30em;line-height:1">AION</div>
      <div class="ser" style="font-size:15px;color:#DCD3C2;margin-top:16px;letter-spacing:0.14em;text-transform:uppercase">ciclos, tempo e consist&ecirc;ncia</div>
    </div>

    <div style="background:#221E17;border:1px solid rgba(255,238,208,0.16);border-radius:14px;padding:32px 32px 28px;box-shadow:0 28px 70px rgba(0,0,0,0.35)">

      <div style="margin-bottom:22px">
        <div class="klabel">E-mail</div>
        <div class="inp">
          <span class="ph">voce@email.com</span>
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#A79C89" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="3.4" width="12.4" height="9.2" rx="1.6"/><path d="M2.2 4.4L8 8.6l5.8-4.2"/></svg>
        </div>
      </div>

      <div style="margin-bottom:20px">
        <div class="klabel">Senha</div>
        <div class="inp">
          <span class="num" style="letter-spacing:0.24em;font-size:18px">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
          <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="#A79C89" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.7 3.6 8 3.6 14.7 8 14.7 8 12.3 12.4 8 12.4 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.1"/></svg>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:19px;height:19px;border-radius:5px;background:#6A5AE0;display:flex;align-items:center;justify-content:center">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>
          </div>
          <span style="color:#DCD3C2;font-size:14.5px">Manter conectado</span>
        </div>
        <a href="#" style="font-size:14.5px">Esqueci minha senha</a>
      </div>

      <div style="height:50px;border-radius:10px;background:#6A5AE0;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px">
        Entrar
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9"/><path d="M8.5 4.5L12 8l-3.5 3.5"/></svg>
      </div>

    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-top:24px;color:#A79C89;font-size:13.5px">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 7V5a3.4 3.4 0 0 1 6.8 0v2"/><rect x="3.3" y="7" width="9.4" height="6.4" rx="1.5"/></svg>
      Acesso restrito &mdash; contas criadas pelo administrador
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
